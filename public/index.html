<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B101B">
  <title>HAUS NOWHERE — 성수 2041 · DS2 산악 월드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/nowhere/nowhere.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="nw-canvas" aria-label="HAUS NOWHERE 성수 2041 3D 월드 뷰어"></canvas>

  <!-- 로딩 화면 -->
  <div id="nw-loader" class="nw-loader">
    <div class="nw-loader-meta">
      <div class="nw-loader-kicker">SEONGSU BLOCK · 2041 ARCHIVE</div>
      <h1 class="nw-loader-title">HAUS NOWHERE — 성수 2041</h1>
      <div id="nw-loader-status" class="nw-loader-status">월드 자산 초기화 중… 0%</div>
      <div class="nw-loader-bar">
        <div id="nw-loader-fill" class="nw-loader-fill"></div>
      </div>
    </div>
  </div>

  <!-- 상단 HUD 바 -->
  <header class="nw-topbar">
    <div class="nw-brand">
      <div class="nw-brand-kicker">37.544°N 127.056°E · SEONGSU 2041</div>
      <div class="nw-brand-title">HAUS NOWHERE SEOUL — 성수 블록 기록</div>
    </div>
    <div class="nw-top-actions">
      <div class="nw-world-switch" role="group" aria-label="월드 배경 버전 선택">
        <button type="button" class="nw-btn is-active" data-world-ver="seongsu">성수 2041</button>
        <button type="button" class="nw-btn" data-world-ver="ds2">DS2 산악</button>
      </div>
      <button id="nw-btn-analysis" type="button" class="nw-btn" aria-pressed="false">
        분석 모드<span class="nw-btn-kbd">A</span>
      </button>
      <button id="nw-btn-walk" type="button" class="nw-btn" aria-pressed="false">
        보행 시점<span class="nw-btn-kbd">W</span>
      </button>
      <button id="nw-btn-intro" type="button" class="nw-btn">
        인트로 비행
      </button>
    </div>
  </header>

  <!-- 분석 모드 레이어 필터 -->
  <nav id="nw-filter-bar" class="nw-filter-bar" aria-label="분석 레이어 필터">
    <button type="button" class="nw-btn is-active" data-layer-filter="all">전체</button>
    <button type="button" class="nw-btn" data-layer-filter="building">건물</button>
    <button type="button" class="nw-btn" data-layer-filter="present">현재</button>
    <button type="button" class="nw-btn" data-layer-filter="future">근미래</button>
    <button type="button" class="nw-btn" data-layer-filter="nature">자연</button>
  </nav>

  <!-- 분석 모드 라벨 & 리더선 레이어 -->
  <div id="nw-analysis-layer" class="nw-analysis-layer" aria-hidden="true">
    <svg id="nw-analysis-svg" class="nw-analysis-svg"></svg>
    <div id="nw-anchor-labels" class="nw-anchor-labels"></div>
  </div>

  <!-- 분석 기록 카드 -->
  <aside id="nw-card" class="nw-card" aria-live="polite">
    <div class="nw-card-header">
      <div>
        <div id="nw-card-kicker" class="nw-card-kicker">BUILDING</div>
        <h2 id="nw-card-title" class="nw-card-title">HAUS NOWHERE</h2>
      </div>
      <button id="nw-card-close" type="button" class="nw-card-close" aria-label="카드 닫기">ESC</button>
    </div>
    <img id="nw-card-thumb" class="nw-card-thumb" src="assets/nowhere/renders/hero-street.webp" alt="구간 렌더">
    <div class="nw-card-section-tag is-fact">기록 · 사실</div>
    <dl id="nw-card-facts" class="nw-card-facts"></dl>
    <div class="nw-card-section-tag is-lore">서사 · 허구 (2041)</div>
    <p id="nw-card-lore" class="nw-card-lore"></p>
    <div id="nw-card-sources" class="nw-card-sources"></div>
  </aside>

  <!-- 하단 컨트롤 독 -->
  <footer class="nw-dock">
    <div class="nw-dock-group">
      <div class="nw-dock-label">기상 · 시간 (WEATHER)</div>
      <div id="nw-weather-seg" class="nw-seg">
        <button type="button" class="nw-btn is-active" data-weather="overcast">흐림</button>
        <button type="button" class="nw-btn" data-weather="rain">비(타임폴)</button>
        <button type="button" class="nw-btn" data-weather="dusk">황혼</button>
        <button type="button" class="nw-btn" data-weather="night">밤</button>
        <button type="button" class="nw-btn" data-weather="snow">눈</button>
      </div>
    </div>

    <div class="nw-dock-group">
      <div class="nw-dock-label">카메라 프리셋 (VIEWPOINT)</div>
      <div id="nw-cam-seg" class="nw-seg">
        <button type="button" class="nw-btn is-active" data-cam="street">거리</button>
        <button type="button" class="nw-btn" data-cam="aerial">조감</button>
        <button type="button" class="nw-btn" data-cam="viaduct">고가 하부</button>
        <button type="button" class="nw-btn" data-cam="night">밤거리</button>
        <button type="button" class="nw-btn" data-cam="ground">노면 근접</button>
        <button type="button" class="nw-btn" data-cam="lot">자연 포켓</button>
      </div>
    </div>
  </footer>

  <script type="module" src="src/nowhere/main.js"></script>
</body>
</html>
